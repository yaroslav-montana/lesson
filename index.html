<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бесплатный урок · ИИ-креатор</title>
<meta name="description" content="Бесплатный урок: в чём суть профессии ИИ-креатора и как начать новичку.">
<meta property="og:title" content="Бесплатный урок · ИИ-креатор">
<meta property="og:description" content="В чём суть профессии ИИ-креатора и как начать новичку.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0c;
    --fg: #f4f2ee;
    --muted: #8d8a85;
    --line: #232325;
    --accent: #e8c27a;
    --accent-fg: #141210;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: Inter, system-ui, -apple-system, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 48px;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(232,194,122,.10), transparent 60%),
      var(--bg);
  }
  .wrap { width: 100%; max-width: 860px; }
  header {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    flex-wrap: wrap;
    padding-bottom: 18px; border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 800; letter-spacing: .14em; font-size: 14px; }
  .tag { color: var(--muted); font-size: 13px; }
  h1 {
    font-size: clamp(26px, 5vw, 44px);
    line-height: 1.12; font-weight: 800; letter-spacing: -.01em;
    margin: 28px 0 22px;
    text-wrap: balance;
  }
  h1 em { font-style: normal; color: var(--accent); }
  .video {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    border-radius: 14px; overflow: hidden;
    background: #000; border: 1px solid var(--line);
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .cta {
    margin-top: 32px; padding: 24px; border: 1px solid var(--line); border-radius: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
    background: rgba(255,255,255,.02);
  }
  .cta p { font-size: 17px; max-width: 480px; }
  .cta p span { display: block; color: var(--muted); font-size: 14px; margin-top: 4px; }
  .btn {
    display: inline-block; text-decoration: none;
    background: var(--accent); color: var(--accent-fg);
    font-weight: 800; font-size: 17px;
    padding: 16px 28px; border-radius: 999px;
    transition: transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 10px 30px rgba(232,194,122,.25);
    white-space: nowrap;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(232,194,122,.35); }
  @media (max-width: 560px) {
    .btn { width: 100%; text-align: center; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">YAROSLAV MONTANA</div>
      <div class="tag">Бесплатный урок</div>
    </header>

    <h1>В чём суть профессии <em>ИИ-креатора</em> и как начать новичку</h1>

    <div class="video">
      <!-- id ролика с YouTube: часть ссылки после watch?v= или youtu.be/ -->
      <iframe
        src="https://www.youtube-nocookie.com/embed/DKoM6GG6Hqk?rel=0&modestbranding=1"
        title="Бесплатный урок"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen></iframe>
    </div>

    <div class="cta">
      <p>Досмотрел урок? Напиши мне — разберу, с чего начать именно тебе.
        <span>Ответ придёт в Telegram</span></p>
      <a class="btn" href="https://t.me/montana_yaroslav?text=%D0%9F%D1%80%D0%B8%D0%B2%D0%B5%D1%82!%20%D0%A5%D0%BE%D1%87%D1%83%20%D0%B7%D0%B0%D0%BF%D0%B8%D1%81%D0%B0%D1%82%D1%8C%D1%81%D1%8F%20%D0%BD%D0%B0%20%D0%BB%D0%B8%D1%87%D0%BD%D1%8B%D0%B9%20%D1%80%D0%B0%D0%B7%D0%B1%D0%BE%D1%80." target="_blank" rel="noopener">Получить разбор</a>
    </div>
  </div>
</body>
</html>
