<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бесплатный урок · видео с помощью нейросетей</title>
<meta name="description" content="Бесплатный урок Ярослава Монтаны: как создавать видео с помощью нейросетей. 25 минут.">
<meta property="og:title" content="Бесплатный урок · видео с помощью нейросетей">
<meta property="og:description" content="Как создавать видео с помощью нейросетей. 25 минут, без воды.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0c;
    --fg: #f4f2ee;
    --muted: #8d8a85;
    --line: #232325;
    --accent: #e8c27a;
    --green: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: Inter, system-ui, -apple-system, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 64px;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(232,194,122,.10), transparent 60%),
      var(--bg);
  }
  .wrap { width: 100%; max-width: 860px; }
  header {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    flex-wrap: wrap;
    padding-bottom: 18px; border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 800; letter-spacing: .14em; font-size: 14px; }
  .tag { color: var(--muted); font-size: 13px; }
  h1 {
    font-size: clamp(26px, 5vw, 44px);
    line-height: 1.12; font-weight: 800; letter-spacing: -.01em;
    margin: 28px 0 14px;
    text-wrap: balance;
  }
  h1 em { font-style: normal; color: var(--accent); }
  .lead { color: var(--muted); font-size: 17px; margin-bottom: 22px; max-width: 640px; }
  .video {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    border-radius: 14px; overflow: hidden;
    background: #000; border: 1px solid var(--line);
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .cta {
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
  }
  .cta p { color: var(--muted); font-size: 15px; }
  .btn {
    display: inline-block; text-decoration: none;
    background: var(--green); color: #fff;
    font-weight: 800; font-size: 18px;
    padding: 18px 44px; border-radius: 999px;
    transition: transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 10px 30px rgba(34,197,94,.30);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(34,197,94,.45); }
  @media (max-width: 560px) {
    .btn { width: 100%; text-align: center; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">YAROSLAV MONTANA</div>
      <div class="tag">Бесплатный урок · 25 минут</div>
    </header>

    <h1>Как создавать <em>видео</em> с помощью нейросетей</h1>
    <p class="lead">Без воды: какие инструменты брать и как собирать ролики, за которые платит бизнес.</p>

    <div class="video">
      <iframe
        src="https://www.youtube-nocookie.com/embed/aSw--lS5IL4?rel=0&modestbranding=1"
        title="Бесплатный урок: как создавать видео с помощью нейросетей"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen></iframe>
    </div>

    <div class="cta">
      <p>Досмотрел урок и хочешь систему целиком, смету и месяц связи со мной?</p>
      <a class="btn" href="https://yaroslav-montana.github.io/course/" target="_blank" rel="noopener">Узнать подробнее про обучение</a>
    </div>
  </div>
</body>
</html>
